<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rakubin</title>
    <base href="/" />
    <link href="loader.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material.css">
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <div class="loader"></div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script src="lib/zxing/index.min.js"></script>
    <script src="_content/BlazorBarcodeScanner.ZXing.JS/BlazorBarcodeScanner.js"></script>
    <script src="./_content/Blazor.QrCodeGen/qrcode.min.js"></script>
    <script type="module" src="./_content/Blazor.QrCodeGen/qrcodeInterop.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
    <script type="text/javascript">
        function downloadFile(fileUrl, fileName) {
            const link = document.createElement('a');
            link.href = fileUrl;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        function openInNewTab(url) {
            window.open(url, '_blank');
        }
    </script>
    <script>
        window.addEventListener("storage", function (e) {
            if (["identity", "user", "role"].includes(e.key) && e.newValue === null) {
                window.location.href = "/login";
            }
        });
    </script>
    <script>
        window.clearAllCache = async () => {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
            localStorage.clear();
            sessionStorage.clear();
        };
    </script>
    <script>
        let voiceReady = false;
        let defaultVoice = null;

        function loadVoice() {
            const voices = speechSynthesis.getVoices();
            defaultVoice = voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang.startsWith('en')) || voices[0];
            voiceReady = !!defaultVoice;
        }

        speechSynthesis.onvoiceschanged = loadVoice;
        window.addEventListener('load', () => {
            loadVoice();
            setTimeout(loadVoice, 100);
        });

        window.speak = function (text) {
            if (!voiceReady) {
                setTimeout(() => window.speak(text), 300);
                return;
            }

            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            msg.pitch = 1;
            msg.rate = 1;
            msg.voice = defaultVoice;

            speechSynthesis.cancel();
            speechSynthesis.speak(msg);
        };
    </script>
    <script>
        window.readImageAsBase64 = (inputId, dotNetHelper) => {
            const input = document.getElementById(inputId);
            const file = input?.files?.[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                const base64 = reader.result;
                dotNetHelper.invokeMethodAsync('OnBase64ImageReady', base64);
            };
            reader.readAsDataURL(file);
        };
    </script>


    <script>
        function speak(text) {
            const msg = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(msg);
        }
    </script>

    <script>
        window.triggerFileInput = function (id) {
            const input = document.getElementById(id);
            if (input) {
                input.click();
            } else {
                console.warn("Input element not found: " + id);
            }
        };
    </script>


















</body>

</html>
